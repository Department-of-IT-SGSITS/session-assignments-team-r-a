<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Notification Form</title>
    
    <!-- === NEW: Favicon for the browser tab === -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2645/2645897.png">

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg mx-auto bg-white rounded-xl shadow-lg p-8 md:p-12 my-8">
        
        <div class="text-center mb-8">
            <img src="https://cdn-icons-png.flaticon.com/512/2645/2645897.png" alt="Notification Bell Logo" class="mx-auto h-16 w-16 mb-4">
            
            <h1 class="text-3xl font-bold text-gray-800">Contact Us</h1>
            <p class="text-gray-500 mt-2">Submit the form to get a notification!</p>
        </div>

        <!-- Notification Area -->
        <div id="notification" class="hidden p-4 mb-4 text-sm rounded-lg" role="alert">
            <span class="font-medium" id="notification-message"></span>
        </div>

        <form id="contact-form">
            <!-- Name Input -->
            <div class="mb-5">
                <label for="name" class="block mb-2 text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="name" name="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Name" required>
            </div>

            <!-- Email Input -->
            <div class="mb-5">
                <label for="email" class="block mb-2 text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" name="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="abc@xyz.com" required>
            </div>

            <!-- Phone Number Input -->
            <div class="mb-5">
                <label for="phone" class="block mb-2 text-sm font-medium text-gray-700">Phone Number (for SMS)</label>
                <input type="tel" id="phone" name="phone" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="+xy-XXXXXXXXXX" required>
                <p class="text-xs text-gray-500 mt-1">Include country code (e.g., +91 for India).</p>
            </div>
            
            <!-- Message Textarea -->
            <div class="mb-6">
                <label for="message" class="block mb-2 text-sm font-medium text-gray-700">Your Message</label>
                <textarea id="message" name="message" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500" placeholder="Leave a comment..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-button" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full px-5 py-3 text-center transition-colors duration-300">
                <span id="button-text">Send Notification</span>
                <span id="button-spinner" class="hidden">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Processing...
                </span>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('contact-form');
        const submitButton = document.getElementById('submit-button');
        const buttonText = document.getElementById('button-text');
        const buttonSpinner = document.getElementById('button-spinner');
        const notification = document.getElementById('notification');
        const notificationMessage = document.getElementById('notification-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            setLoading(true);
            notification.classList.add('hidden');

            const formData = new FormData(form);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                message: formData.get('message'),
            };

            try {
                
                const response = await fetch('/notify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });
                
                const result = await response.json();

                if (response.ok) {
                    showNotification(result.message, 'success');
                    form.reset();
                } else {
                    showNotification(result.message || 'An error occurred.', 'error');
                }

            } catch (error) {
                console.error('Submission error:', error);
                showNotification('Could not connect to the server. Please try again later.', 'error');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            if (isLoading) {
                submitButton.disabled = true;
                buttonText.classList.add('hidden');
                buttonSpinner.classList.remove('hidden');
            } else {
                submitButton.disabled = false;
                buttonText.classList.remove('hidden');
                buttonSpinner.classList.add('hidden');
            }
        }

        function showNotification(message, type) {
            notificationMessage.textContent = message;
            
            if (type === 'success') {
                notification.className = 'p-4 mb-4 text-sm text-green-800 rounded-lg bg-green-100';
            } else { // error
                notification.className = 'p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-100';
            }
            
            notification.classList.remove('hidden');
        }
    </script>
</body>
</html>
