<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serverless Email Clone</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/561/561127.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Inter", sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="w-full max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-8 md:p-12 my-8">
    <div class="text-center mb-8">
      <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="Email Icon" class="mx-auto h-16 w-16 mb-4" />
      <h1 class="text-3xl font-bold text-gray-800">Compose Email</h1>
      <p class="text-gray-500 mt-2">Send an email (and SMS) notification instantly</p>
    </div>

    <!-- Notification Area -->
    <div id="notification" class="hidden p-4 mb-4 text-sm rounded-lg" role="alert">
      <span class="font-medium" id="notification-message"></span>
    </div>

    <form id="contact-form" enctype="multipart/form-data">
      <!-- From Name -->
      <div class="mb-5">
        <label for="name" class="block mb-2 text-sm font-medium text-gray-700">Your Name</label>
        <input type="text" id="name" name="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="John Doe" required />
      </div>

      <!-- To Email -->
      <div class="mb-5">
        <label for="email" class="block mb-2 text-sm font-medium text-gray-700">To</label>
        <input type="email" id="email" name="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="abc@example.com, xyz@example.com" required />
        <p class="text-xs text-gray-500 mt-1">You can enter multiple emails separated by commas.</p>
      </div>

      <!-- CC -->
      <div class="mb-5">
        <label for="cc" class="block mb-2 text-sm font-medium text-gray-700">CC</label>
        <input type="text" id="cc" name="cc" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="cc1@example.com, cc2@example.com" />
      </div>

      <!-- BCC -->
      <div class="mb-5">
        <label for="bcc" class="block mb-2 text-sm font-medium text-gray-700">BCC</label>
        <input type="text" id="bcc" name="bcc" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="hidden@example.com" />
      </div>

      <!-- Phone (for SMS) -->
      <div class="mb-5">
        <label for="phone" class="block mb-2 text-sm font-medium text-gray-700">Phone (for SMS)</label>
        <input type="tel" id="phone" name="phone" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="+91XXXXXXXXXX" required />
        <p class="text-xs text-gray-500 mt-1">Include country code (e.g., +91 for India)</p>
      </div>

      <!-- Subject -->
      <div class="mb-5">
        <label for="subject" class="block mb-2 text-sm font-medium text-gray-700">Subject</label>
        <input type="text" id="subject" name="subject" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Subject" required />
      </div>

      <!-- Message -->
      <div class="mb-6">
        <label for="message" class="block mb-2 text-sm font-medium text-gray-700">Message</label>
        <textarea id="message" name="message" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500" placeholder="Write your email..."></textarea>
      </div>

      <!-- File Attachment -->
      <div class="mb-6">
        <label for="attachments" class="block mb-2 text-sm font-medium text-gray-700">Attachments</label>
        <input type="file" id="attachments" name="attachments" multiple class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none" />
        <p class="text-xs text-gray-500 mt-1">You can select multiple files (max ~40MB total).</p>
      </div>

      <!-- Submit -->
      <button type="submit" id="submit-button" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full px-5 py-3 text-center transition-colors duration-300">
        <span id="button-text">Send Email</span>
        <span id="button-spinner" class="hidden">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Sending...
        </span>
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById("contact-form");
    const submitButton = document.getElementById("submit-button");
    const buttonText = document.getElementById("button-text");
    const buttonSpinner = document.getElementById("button-spinner");
    const notification = document.getElementById("notification");
    const notificationMessage = document.getElementById("notification-message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      setLoading(true);
      notification.classList.add("hidden");

      const formData = new FormData(form);

      try {
        const response = await fetch("/notify", {
          method: "POST",
          body: formData,
        });

        const result = await response.json();
        if (response.ok) {
          showNotification(result.message, "success");
          form.reset();
        } else {
          showNotification(result.message || "An error occurred.", "error");
        }
      } catch (error) {
        console.error("Submission error:", error);
        showNotification("Could not connect to the server. Please try again later.", "error");
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      if (isLoading) {
        submitButton.disabled = true;
        buttonText.classList.add("hidden");
        buttonSpinner.classList.remove("hidden");
      } else {
        submitButton.disabled = false;
        buttonText.classList.remove("hidden");
        buttonSpinner.classList.add("hidden");
      }
    }

    function showNotification(message, type) {
      notificationMessage.textContent = message;
      if (type === "success") {
        notification.className = "p-4 mb-4 text-sm text-green-800 rounded-lg bg-green-100";
      } else {
        notification.className = "p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-100";
      }
      notification.classList.remove("hidden");
    }
  </script>
</body>
</html>
